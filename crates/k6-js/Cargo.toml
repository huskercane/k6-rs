[package]
name = "k6-js"
version.workspace = true
edition.workspace = true

# async-spike: Phase 0 of the async-runtime migration (ASYNC_RUNTIME_PLAN.md).
# THROWAWAY — enables rquickjs AsyncRuntime/AsyncContext to prove the
# pool-of-loops mechanism + per-VU isolation. Delete once Phase 1 lands.
#
# b2-spike: Phase 0.5 — proves stackful-coroutine (corosensei) suspension of a
# synchronous QuickJS host fn (the faithful goja-goroutine port). THROWAWAY;
# deleted once the suspension mechanism is chosen.
[features]
async-spike = ["rquickjs/futures"]
b2-spike = ["dep:corosensei"]

[dependencies]
k6-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rquickjs = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
base64 = { workspace = true }
md-5 = { workspace = true }
md4 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
ripemd = { workspace = true }
digest = { workspace = true }
rand = { workspace = true }
scraper = { workspace = true }
ipnet = { workspace = true }
url = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
futures-util = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
cbc = { workspace = true }
ctr = { workspace = true }
pbkdf2 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
webpki-roots = { workspace = true }
corosensei = { version = "0.3.4", optional = true }

[dev-dependencies]
axum = { workspace = true }
tokio-util = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "http_bridge"
harness = false
