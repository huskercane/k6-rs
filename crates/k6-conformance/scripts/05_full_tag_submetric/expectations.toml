[run]
expected_exit_code = 0

[tolerances]
default_counter = "exact"
default_trend = "relative:0.30"

[tolerances.overrides]
"http_reqs" = { count = "exact", rate = "relative:0.50" }
"iterations" = { count = "exact", rate = "relative:0.50" }
"data_sent" = { count = "relative:0.10", rate = "relative:0.50" }
"data_received" = { count = "relative:0.10", rate = "relative:0.50" }
# Full-tag combination — both binaries should agree exactly on the
# request count for the {name:get,status:200} bucket. Trend stats keep
# the standard µs-localhost-noise tolerance.
"http_reqs{name:get,status:200}" = { count = "exact", rate = "relative:0.50" }

# Known asymmetries — acknowledged architectural gaps, NOT engine bugs.
[known_drift]
"vus" = "upstream --summary-export does not emit gauges; k6-rs does (engine schema asymmetry)"
"vus_max" = "same as vus"
# CG-3 unlocks the storage shape so this drift will close once k6-rs also
# emits `expected_response` as an http sample tag (separate follow-up,
# kept out of CG-3's scope per design review).
"http_req_duration{expected_response:true}" = "k6-rs does not yet emit `expected_response` tag on http samples (post-CG-3 follow-up)"
"http_req_duration{expected_response:true,name:get,status:200}" = "same as above — needs expected_response tag emission"
