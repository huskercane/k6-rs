[run]
# Threshold fails immediately and abortOnFail triggers — both binaries
# exit 99 (threshold failure).
expected_exit_code = 99

[tolerances]
# Abort timing legitimately differs between binaries (different VU loop
# overheads → different iteration counts at abort). Every counter
# emitted during the run inherits that variance, including the CG-6
# per-metric sample counts in the event stream. `default_counter` is
# relaxed accordingly — this is NOT loosening to mask drift, the
# variance is by-design for an abort-on-fail script.
default_counter = "relative:0.80"
default_trend = "relative:0.50"

[tolerances.overrides]
# Same variance applies to user-facing counter/rate fields. Trends'
# time-stat shapes are still gated by default_trend (50%) — we care
# that the timing distribution shape is similar, not the absolute
# count of samples that fed it.
"http_reqs" = { count = "relative:0.80", rate = "relative:0.80" }
"iterations" = { count = "relative:0.80", rate = "relative:0.80" }
"data_sent" = { count = "relative:0.80", rate = "relative:0.80" }
"data_received" = { count = "relative:0.80", rate = "relative:0.80" }

[known_drift]
"vus" = "upstream --summary-export does not emit gauges; k6-rs does (engine schema asymmetry)"
"vus_max" = "same as vus"
