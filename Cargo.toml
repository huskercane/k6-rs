[workspace]
members = ["crates/k6-core", "crates/k6-js", "crates/k6-cli", "crates/k6-conformance"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
k6-core = { path = "crates/k6-core" }
k6-js = { path = "crates/k6-js" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
parking_lot = "0.12"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-queue = "0.3"
rquickjs = { version = "0.12.1", features = ["classes", "properties", "parallel"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["rustls"], default-features = false }
rustls = "0.23"
rustls-pki-types = "1"
hdrhistogram = "7"
base64 = "0.22"
md-5 = "0.11.0"
md4 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
hmac = "0.13.0"
ripemd = "0.2.0"
digest = "0.11.3"
rand = "0.10.2"
scraper = "0.27.0"
ipnet = "2"
url = "2"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
futures-util = "0.3"
tonic = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
hyper = { version = "1", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
webpki-roots = "1"
snap = "1"
duckdb = "1"
csv = "1"
dotenvy = "0.15"
aes = "0.9.1"
aes-gcm = "0.11.0"
cbc = { version = "0.2.1", features = ["alloc"] }
ctr = "0.10.1"
pbkdf2 = "0.13.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
axum = "0.8"
