[run]
expected_exit_code = 0

[tolerances]
# The shared pool is a fixed size, so total iteration/request counts are
# exact across both engines. Timing trends stay ignored — sub-ms localhost
# values are scheduler-jitter dominated (see 01_http_get for the measured
# rationale).
default_counter = "exact"
default_trend = "ignore"

[tolerances.overrides]
# rate is ignored on this micro-script for the same per-iteration-overhead
# reason documented at length in 01_http_get: k6-rs's execution window runs
# ~4x longer on a trivial localhost loop (QuickJS vs Go), so wall-clock rate
# reads low even when total counts match exactly. Count carries the signal.
"http_reqs" = { count = "exact", rate = "ignore" }
"iterations" = { count = "exact", rate = "ignore" }
"data_sent" = { count = "relative:0.10", rate = "ignore" }
"data_received" = { count = "relative:0.10", rate = "ignore" }

[known_drift]
"vus" = "upstream --summary-export does not emit gauges; k6-rs does (engine schema asymmetry)"
"vus_max" = "same as vus"
