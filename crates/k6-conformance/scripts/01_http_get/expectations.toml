[run]
expected_exit_code = 0

[tolerances]
default_counter = "exact"
# Trend (timing) parity is NOT a meaningful signal for this local smoke script.
# Measured: on a 10-iteration localhost run the http_req_* trends swing 30-90%
# between successive same-config runs (sub-millisecond values dominated by
# scheduler jitter). A relative band wide enough to pass would be too wide to
# catch any real regression. Count + sample-count parity below carry the signal.
#
# Two trend gaps here are STRUCTURAL, not jitter, and are tracked to fix (they
# stay silenced only because `ignore` is per-metric, not per-field):
#   - http_req_connecting median reads 0 in k6-rs vs ~0.21ms upstream (k6-rs
#     records 0 connect time on reused conns; upstream attributes differently).
#   - http_req_sending runs ~85% lower in k6-rs than upstream, one-directional
#     across every run — a real accounting difference, not symmetric noise.
default_trend = "ignore"

[tolerances.overrides]
# `rate = "ignore"` retained, but the reason has SHRUNK after the denominator
# fix. Originally the rate denominator was structurally wrong: k6-rs divided by
# full wall-clock incl. VU/runtime init + teardown (test_start.elapsed()),
# upstream by the tight execution window (MarkStarted-after-init .. MarkEnded).
# That made k6-rs rates read ~20-50x too low. Fixed in main.rs by dividing by
# the accumulated executor RunSummary.duration (the real execution window);
# labeled drift on this script dropped from ~95% to ~70%.
# The ~70% RESIDUAL is NOT a denominator bug — it's genuine per-iteration
# overhead: on a trivial 10-iteration localhost loop k6-rs runs ~1ms/iter vs
# upstream ~0.25ms/iter (QuickJS vs Go), so k6-rs's execution window is ~4x
# longer and its rate ~4x lower. This is the SAME micro-overhead that keeps the
# trend metrics ignored, and it vanishes under real network latency (measured:
# both engines ~230 req/s at ~42ms/req). Sub-ms windows are also jittery
# (upstream swings 3600->4100/s run-to-run). So rate stays `ignore` on this
# micro-script; gate rate on a longer-duration script where per-iteration
# overhead is amortized. `ignore` remains the only per-field lever (metric-
# level known_drift would also drop the `count = exact` parity). Counts carry
# the real signal.
"http_reqs" = { count = "exact", rate = "ignore" }
"iterations" = { count = "exact", rate = "ignore" }
# data_sent count band admits a DETERMINISTIC offset, not slop: k6-rs counts
# 740 request bytes vs upstream 690 (+50B, ~5B/req) identically on every run —
# a request wire-byte accounting difference between hyper and Go net/http.
# Tracked to root-cause; 0.10 covers the fixed offset without masking a real
# regression on this 10-request script. rate ignored per the note above.
"data_sent" = { count = "relative:0.10", rate = "ignore" }
"data_received" = { count = "relative:0.10", rate = "ignore" }

# Known asymmetries — acknowledged architectural gaps, NOT engine bugs.
# Bugs should be tracked separately and fixed, not buried here.
[known_drift]
"vus" = "upstream --summary-export does not emit gauges; k6-rs does (engine schema asymmetry)"
"vus_max" = "same as vus"
