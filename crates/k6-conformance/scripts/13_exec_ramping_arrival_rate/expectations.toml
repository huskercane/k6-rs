[run]
expected_exit_code = 0

[tolerances]
# Count is the exact integral of the staged rate curve. After the dispatch
# rewrite (k6-core executor/ramping_arrival_rate.rs now catches up to the
# analytical arrival integral instead of sleeping 1/instantaneous-rate),
# k6-rs lands on 150 vs upstream's 149-150 across repeated runs — sub-1%.
# The tight 0.03 band reflects that: a wrong ramp slope or dropped stage
# moves the total well outside it. (Pre-fix this drifted ~8% low; the band
# is deliberately far too tight to have passed the bug.)
default_counter = "relative:0.03"
default_trend = "ignore"

[tolerances.overrides]
"http_reqs" = { count = "relative:0.03", rate = "ignore" }
"iterations" = { count = "relative:0.03", rate = "ignore" }
"data_sent" = { count = "relative:0.10", rate = "ignore" }
"data_received" = { count = "relative:0.10", rate = "ignore" }

[known_drift]
"vus" = "upstream --summary-export does not emit gauges; k6-rs does (engine schema asymmetry)"
"vus_max" = "same as vus"
