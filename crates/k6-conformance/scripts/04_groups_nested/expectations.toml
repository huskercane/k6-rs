[run]
expected_exit_code = 0

[tolerances]
default_counter = "exact"
default_trend = "relative:0.30"

[tolerances.overrides]
"http_reqs" = { count = "exact", rate = "relative:0.50" }
"iterations" = { count = "exact", rate = "relative:0.50" }
"data_sent" = { count = "relative:0.10", rate = "relative:0.50" }
"data_received" = { count = "relative:0.10", rate = "relative:0.50" }
# Aggregate group_duration trend: 300 samples (3 group invocations × 100
# iterations). Same µs-scale localhost variance as other trends.
"group_duration" = { count = "exact", trend = "relative:0.30" }

# Known asymmetries — acknowledged architectural gaps, NOT engine bugs.
[known_drift]
"vus" = "upstream --summary-export does not emit gauges; k6-rs does (engine schema asymmetry)"
"vus_max" = "same as vus"
# CG-6 surfaced this real engine divergence: upstream emits data_sent /
# data_received once per dialer snapshot (lib/netext/dialer.go IOSamples,
# triggered roughly once per VU iteration), while k6-rs emits once per HTTP
# request. Same total bytes counted; different per-sample cadence. Only
# 04 surfaces it because it's the only script with >1 http.get per iter
# (200 http_reqs vs 100 iterations). Tracked as a separate engine parity
# follow-up; out of CG-6 (sink wire format) scope.
"data_sent" = "k6-rs emits per-request, upstream per-dialer-snapshot — sample-count differs when iter has >1 http call"
"data_received" = "same as data_sent — engine emission cadence differs"
