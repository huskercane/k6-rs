[run]
expected_exit_code = 0

[tolerances]
# Count is time-bound. The 100ms sleep gates throughput by wall-clock so both
# engines land near ~150 iterations, but the last partial iteration per VU at
# the 3s cutoff varies — a modest band, not exact. Calibrated against a real
# dual-run (see PARITY notes), tightened to the smallest band that passes.
default_counter = "relative:0.10"
default_trend = "ignore"

[tolerances.overrides]
"http_reqs" = { count = "relative:0.10", rate = "ignore" }
"iterations" = { count = "relative:0.10", rate = "ignore" }
"data_sent" = { count = "relative:0.10", rate = "ignore" }
"data_received" = { count = "relative:0.10", rate = "ignore" }

[known_drift]
"vus" = "upstream --summary-export does not emit gauges; k6-rs does (engine schema asymmetry)"
"vus_max" = "same as vus"
